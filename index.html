<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Guinho Loader</title>
    <link rel="icon" href="assets/guinho.ico" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700&display=swap" rel="stylesheet">
    <style>
      *{
        margin:0;
        padding:0;
        box-sizing:border-box;
      }
      body{
        display:flex;
        justify-content:center;
        align-items:center;
        width:100%;
        height:100vh;
        overflow:hidden;
        font-family:'Mulish',sans-serif;
        background:linear-gradient(
          -45deg,
          #ffffff,
          #f7f9fc,
          #eef4ff,
          #f8faff
        );
        background-size:300% 300%;
        animation:gradientMove 8s ease infinite;
      }
      .loader-wrapper{
        position:relative;
        animation:
          fadeIn .6s ease-out,
          float 2.4s ease-in-out .6s 1;
        animation-fill-mode:both;
      }
      /* Resplandor */
      .loader-wrapper::before{
        content:"";
        position:absolute;
        inset:-14px;
        border-radius:30px;
        background:radial-gradient(
          circle,
          rgba(58,134,255,.16) 0%,
          rgba(58,134,255,.08) 45%,
          transparent 75%
        );
        filter:blur(18px);
        z-index:-1;
      }
      /* Sombra */
      .loader-wrapper::after{
        content:"";
        position:absolute;
        left:50%;
        bottom:-18px;
        transform:translateX(-50%);
        width:70%;
        height:18px;
        border-radius:50%;
        background:rgba(0,0,0,.14);
        filter:blur(14px);
        z-index:-2;
      }
      .loader{
        display:block;
        width:100%;
        max-width:420px;
        height:auto;
        border-radius:22px;
        box-shadow:
          0 18px 40px rgba(0,0,0,.18);
      }
      @keyframes fadeIn{
        from{
          opacity:0;
          transform:scale(.94);
        }
        to{
          opacity:1;
          transform:scale(1);
        }
      }
      @keyframes float{
        0%{
          transform:translateY(0px);
        }
        50%{
          transform:translateY(-6px);
        }
        100%{
          transform:translateY(0px);
        }
      }
      @keyframes gradientMove{
        0%{
          background-position:0% 50%;
        }
        50%{
          background-position:100% 50%;
        }
        100%{
          background-position:0% 50%;
        }
      }
      @media (max-width:480px){
        .loader{
          max-width:280px;
          border-radius:18px;
        }
        .loader-wrapper::before{
          inset:-10px;
        }
      }
      @media (min-width:1024px){
        .loader{
          max-width:560px;
        }
      }
    </style>
  </head>

  <body>
    <div class="loader-wrapper">
      <img
        class="loader"
        src="assets/bob.gif"
        alt="Cargando..."
      >
    </div>
    <script>
      setTimeout(() => {
        window.location.href = "auth.html";
      }, 3000);
    </script>
  </body>
  
</html>
