<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>Visor Seguro - Guiño Guiño</title>
    
    <!-- Fuentes unificadas con auth y menu -->
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Goldman&family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Librerías -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAA7SZYGbCZrBpurLVrW4RPbM5Zl-32Mog",
            authDomain: "trkkn-cot-firebase.firebaseapp.com",
            projectId: "trkkn-cot-firebase",
            storageBucket: "trkkn-cot-firebase.firebasestorage.app",
            messagingSenderId: "490397786735",
            appId: "1:490397786735:web:6cc8d158f904865bdc239a"
        };
        firebase.initializeApp(firebaseConfig);
    </script>

    <style>
        body, html {
            margin: 0; padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Mulish', sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            visibility: hidden; 
        }

        @media print { body { display: none !important; } }

        /* Pantalla de inicio unificada */
        #start-screen {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10000;
        }

        #start-screen h2 {
            font-family: "Goldman", sans-serif;
            font-size: 24px;
            margin-bottom: 30px;
        }

        #start-btn {
            padding: 12px 24px;
            background: #000000;
            color: #ffffff;
            border: 2px solid transparent;
            border-radius: 10px;
            font-family: "Goldman", sans-serif;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }

        #start-btn:hover {
            background: #DB0000;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
            border: 2px solid #900000;
            letter-spacing: 1px;
        }

        #viewer-area {
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            width: 100%; height: 100%; position: relative;
        }

        canvas { box-shadow: 0 0 20px rgba(255,255,255,0.1); }

        /* Controles Sobrios */
        #controls {
            position: fixed;
            bottom: 25px;
            background: rgba(10, 10, 10, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            font-family: "Goldman", sans-serif;
            font-size: 14px;
            color: #888;
            backdrop-filter: blur(5px);
            z-index: 9999;
        }

        #controls button {
            background: transparent;
            color: #fff;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.2s;
        }

        #controls button:hover { color: #DB0000; }
        
        #page_count_info span { color: #fff; }

        /* Marca de Agua Extrema */
        #watermark-container {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            pointer-events: none;
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.55; 
            transform: rotate(-25deg);
            overflow: hidden;
        }

        .watermark-text {
            font-family: monospace;
            font-size: 20px;
            color: #DB0000;
            font-weight: 900;
            white-space: pre-wrap; /* Permite que el bloque gigante se acomode */
            text-align: justify;
            text-shadow: 1px 1px 2px #000;
            line-height: 1.5;
            width: 150%;
        }

        /* Trampa Blackout */
        #blackout-screen {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000; color: #DB0000;
            z-index: 999999; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; font-family: 'Goldman', sans-serif;
        }
    </style>
</head>
<body>

    <div id="blackout-screen">
        <h1 style="font-size: 32px;">🚫 ACCESO DENEGADO 🚫</h1>
        <p style="font-family: 'Mulish', sans-serif;">Intento de captura de pantalla bloqueado.<br>Incidente registrado en el servidor.</p>
    </div>

    <div id="start-screen">
        <h2>🤫 Proyecto TT_MBP</h2>
        <button id="start-btn">🔒 Abrir Documento</button>
    </div>

    <div id="viewer-area">
        <div id="watermark-container">
            <div id="watermark-content" class="watermark-text"></div>
        </div>
        <canvas id="pdf-canvas"></canvas>
        <div id="controls">
            <button id="prev-btn">&#9668;</button>
            <span id="page_count_info"><span id="page_num"></span> / <span id="page_count"></span></span>
            <button id="next-btn">&#9658;</button>
        </div>
    </div>

    <script>
        let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null;
        const canvas = document.getElementById('pdf-canvas'), ctx = canvas.getContext('2d');
        const auth = firebase.auth();
        let userEmail = "Usuario Desconocido";

        auth.onAuthStateChanged(user => {
            if (!user) window.location.href = "auth.html";
            else {
                userEmail = user.email; 
                document.body.style.visibility = "visible"; 
            }
        });

        // Seguridad de Interfaz y Trampas
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && ['p', 's', 'u', 'c', 'x', 'a', '+', '-'].includes(e.key.toLowerCase()))) {
                e.preventDefault();
            }
        });

        const blackout = document.getElementById('blackout-screen');
        window.addEventListener('blur', () => blackout.style.display = 'flex');
        window.addEventListener('focus', () => blackout.style.display = 'none');
        // Extra: Si el mouse sale de la ventana (hacia la barra de tareas)
        document.addEventListener('mouseleave', () => blackout.style.display = 'flex');
        document.addEventListener('mouseenter', () => blackout.style.display = 'none');
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'PrintScreen') alert('Capturas estrictamente prohibidas.');
        });

        // Generador de Marca de Agua Continua
        async function aplicarMarcaDeAgua() {
            const container = document.getElementById('watermark-content');
            const fecha = new Date().toLocaleString();
            let ip = 'Rastreada';
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                ip = data.ip;
            } catch(e) {}

            // Crear un ID de rastreo único (Hash corto)
            const trackId = CryptoJS.MD5(userEmail + ip + fecha).toString().substring(0, 8).toUpperCase();

            // Bloques continuos
            const l1 = "⚠️RESTRICTED⚠️ ".repeat(30);
            const l2 = `User: ${userEmail} `.repeat(15);
            const l3 = `IP: ${ip} `.repeat(20);
            const l4 = `${fecha} `.repeat(20);
            const l5 = `DO NOT SHARE - I'll be watching you! [ID:${trackId}] `.repeat(10);
            
            // Unir y repetir masivamente
            const bloque = `${l1}\n${l2}\n${l3}\n${l4}\n${l5}\n\n`;
            container.textContent = bloque.repeat(15);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen(); 
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen(); 
            setTimeout(() => iniciarCargaSegura(), 500);
        });

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        async function iniciarCargaSegura() {
            const password = prompt("Ingrese la contraseña de descifrado para ttmbp.enc:");
            if (!password) {
                if (document.exitFullscreen) document.exitFullscreen();
                return;
            }
            try {
                const response = await fetch('ttmbp.enc');
                if (!response.ok) throw new Error("Archivo no encontrado");
                
                const textoEncriptado = await response.text();
                const bytes = CryptoJS.AES.decrypt(textoEncriptado, password);
                const base64PDF = bytes.toString(CryptoJS.enc.Utf8);
                
                if (!base64PDF) throw new Error("Contraseña incorrecta");

                const base64Data = base64PDF.split(',')[1];
                const pdfDatosBinarios = atob(base64Data);
                const arrayBytes = new Uint8Array(pdfDatosBinarios.length);
                for (let i = 0; i < pdfDatosBinarios.length; i++) {
                    arrayBytes[i] = pdfDatosBinarios.charCodeAt(i);
                }

                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('viewer-area').style.display = 'flex';

                aplicarMarcaDeAgua();

                pdfDoc = await pdfjsLib.getDocument({ data: arrayBytes }).promise;
                document.getElementById('page_count').textContent = pdfDoc.numPages;
                renderPage(pageNum);
            } catch (error) {
                console.error(error);
                alert("Error: Contraseña incorrecta o archivo no disponible.");
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        async function renderPage(num) {
            pageRendering = true;
            const page = await pdfDoc.getPage(num);
            const scaleUnadjusted = page.getViewport({ scale: 1 });
            const windowHeight = window.innerHeight * 0.95; 
            const dynamicScale = windowHeight / scaleUnadjusted.height;
            const viewport = page.getViewport({ scale: dynamicScale });
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            pageRendering = false;
            document.getElementById('page_num').textContent = num;

            if (pageNumPending !== null) {
                renderPage(pageNumPending);
                pageNumPending = null;
            }
        }

        function queueRenderPage(num) {
            if (pageRendering) pageNumPending = num;
            else renderPage(num);
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (pageNum <= 1) return;
            pageNum--; queueRenderPage(pageNum);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++; queueRenderPage(pageNum);
        });
    </script>
</body>
</html>
